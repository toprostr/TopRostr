name: Landing CI

# landing-ci is a required check on main and develop. A paths filter on
# pull_request never reports a status when those paths are untouched, so
# the pull request stays blocked. Always run this job for those branches.
# Push keeps the filter: unrelated branch pushes do not need a landing build.
on:
  pull_request:
    branches: [main, develop]
  push:
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing-ci.yml"

permissions:
  contents: read

jobs:
  landing-ci:
    name: landing-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json

      - name: Install dependencies
        working-directory: apps/landing
        run: npm ci

      - name: Lint
        working-directory: apps/landing
        run: npm run lint

      - name: Test
        working-directory: apps/landing
        run: npm test

      - name: Build
        working-directory: apps/landing
        run: npm run build
