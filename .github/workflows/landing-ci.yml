name: Landing CI

on:
  pull_request:
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing-ci.yml"
  push:
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing-ci.yml"

jobs:
  landing-ci:
    name: landing-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json

      - name: Install dependencies
        working-directory: apps/landing
        run: npm ci

      - name: Lint
        working-directory: apps/landing
        run: npm run lint

      - name: Build
        working-directory: apps/landing
        run: npm run build
