name: Extraction CI

on:
  push:
    branches: [feature/poc-1.0]
    paths:
      - "apps/extraction/**"
      - ".github/workflows/extraction-ci.yml"

jobs:
  extraction-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: apps/extraction
        run: uv sync --locked

      - name: Ruff lint
        working-directory: apps/extraction
        run: uv run ruff check .

      - name: Ruff formatting
        working-directory: apps/extraction
        run: uv run ruff format --check .

      - name: Pyright
        working-directory: apps/extraction
        run: uv run pyright

      - name: Run tests
        working-directory: apps/extraction
        run: uv run pytest -v
