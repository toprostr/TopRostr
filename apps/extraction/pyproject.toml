[project]
name = "toprostr-extraction"
version = "0.1.0"
description = "Extract structured athlete facts from one recruiting email. Does not send, score, or read a mailbox."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "openai>=1.68.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extraction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=extraction --cov-branch --cov-report=term-missing --cov-fail-under=80"
markers = [
    "manual: calls the live OpenAI API; skipped unless OPENAI_API_KEY is set",
]

[tool.coverage.run]
branch = true
source = ["extraction"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.pyright]
pythonVersion = "3.13"
include = ["extraction", "tests"]
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py313"
line-length = 88
