<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}TopRostr{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/app.css" />
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>
      function toggleFilm(button) {
        const root = button.closest("[data-film]");
        const panel = root.querySelector("[data-film-panel]");
        const frame = panel.querySelector("iframe");
        const play = root.querySelector(".poster-btn");
        const willOpen = panel.hasAttribute("hidden");
        if (willOpen) {
          if (!frame.getAttribute("src")) {
            frame.src = frame.dataset.src;
          }
          panel.hidden = false;
          root.classList.add("is-open");
          if (play) play.setAttribute("aria-expanded", "true");
          return;
        }
        panel.hidden = true;
        frame.removeAttribute("src");
        root.classList.remove("is-open");
        if (play) play.setAttribute("aria-expanded", "false");
      }
    </script>
  </head>
  <body>
    <header class="nav">
      <a class="logo" href="/"><span class="mark">TR</span>TopRostr</a>
      <nav class="links">
        <a href="/" class="{% if active == 'review' %}on{% endif %}">Recruit Review</a>
        <a href="/tracker" class="{% if active == 'tracker' %}on{% endif %}">Tracker</a>
      </nav>
    </header>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
